name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        shell: python
        run: |
          import subprocess, sys
          r = subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-v"], capture_output=True, text=True)
          out = r.stdout + r.stderr
          print(out)
          if r.returncode:
              # Surface failures as annotations so they are readable without raw logs.
              blocks = [b for b in out.split("=" * 70) if "FAIL:" in b or "ERROR:" in b] or [out[-6000:]]
              for b in blocks[:10]:
                  msg = b.strip()[:6000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title=Test failure::{msg}")
          sys.exit(r.returncode)

  widget:
    name: Widget build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build source/RepoPulse.csproj -c Release --nologo
